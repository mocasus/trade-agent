[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "trade-agent"
version = "0.1.0"
description = "AI-powered modular trading agent with plugin system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "mocasus"},
]
dependencies = [
    "ccxt>=4.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.24",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=20.0"]
indicators = ["pandas-ta>=0.3"]
all = [
    "python-telegram-bot>=20.0",
    "pandas-ta>=0.3",
]

[project.scripts]
trade-agent = "trade_agent.agent:main"

[tool.setuptools.packages.find]
include = ["trade_agent*"]
