<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!-- Background: rounded square, dark -->
  <rect width="256" height="256" rx="48" fill="#0d1117"/>

  <!-- Candlestick chart (center-left, green) -->
  <g transform="translate(48, 52)">
    <!-- Wick + body: candle 1 (bull) -->
    <line x1="16" y1="8" x2="16" y2="72" stroke="#2ea44f" stroke-width="3"/>
    <rect x="8" y="20" width="16" height="36" rx="2" fill="#2ea44f"/>

    <!-- Wick + body: candle 2 (bear) -->
    <line x1="52" y1="4" x2="52" y2="68" stroke="#f85149" stroke-width="3"/>
    <rect x="44" y="16" width="16" height="40" rx="2" fill="#f85149"/>

    <!-- Wick + body: candle 3 (bull, tall) -->
    <line x1="88" y1="0" x2="88" y2="80" stroke="#2ea44f" stroke-width="3"/>
    <rect x="80" y="12" width="16" height="52" rx="2" fill="#2ea44f"/>

    <!-- Wick + body: candle 4 (bull) -->
    <line x1="124" y1="20" x2="124" y2="84" stroke="#2ea44f" stroke-width="3"/>
    <rect x="116" y="36" width="16" height="32" rx="2" fill="#2ea44f"/>
  </g>

  <!-- AI node graph (bottom-right, accent) -->
  <g transform="translate(140, 120)">
    <!-- Connection lines -->
    <line x1="8" y1="8" x2="40" y2="24" stroke="#58a6ff" stroke-width="2.5" opacity="0.6"/>
    <line x1="8" y1="8" x2="40" y2="56" stroke="#58a6ff" stroke-width="2.5" opacity="0.6"/>
    <line x1="40" y1="24" x2="72" y2="40" stroke="#58a6ff" stroke-width="2.5" opacity="0.6"/>
    <line x1="40" y1="56" x2="72" y2="40" stroke="#58a6ff" stroke-width="2.5" opacity="0.6"/>

    <!-- Nodes -->
    <circle cx="8" cy="8" r="7" fill="#58a6ff"/>
    <circle cx="40" cy="24" r="6" fill="#58a6ff"/>
    <circle cx="40" cy="56" r="6" fill="#58a6ff"/>
    <circle cx="72" cy="40" r="8" fill="#2ea44f"/>
  </g>

  <!-- Trend arrow (bottom-left, green) -->
  <g transform="translate(52, 168)">
    <path d="M0 20 L20 0 L40 12 L60 4" stroke="#2ea44f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M50 -2 L64 -2 L64 12" stroke="#2ea44f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>