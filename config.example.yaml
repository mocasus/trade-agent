agent:
  name: trade-agent-v1
  log_level: INFO
  log_file: ~/.trade-agent/logs/agent.log
  data_dir: ~/.trade-agent
  timezone: Asia/Jakarta
plugins:
  data_source: ccxt
  strategy: llm
  exchange: paper
  notifier:
  - console
  sentiment: none
  risk_profile: moderate
  indicators: ta
data_source:
  exchange: binance
  api_key: ${BINANCE_API_KEY}
  api_secret: ${BINANCE_API_SECRET}
  testnet: true
  rate_limit: true
  csv_path: ~/.trade-agent/data/history.csv
  csv_format: binance_klines
strategy:
  ai:
    base_url: ${AI_BASE_URL}
    api_key: ${AI_API_KEY}
    model: gpt-4o-mini
    temperature: 0.3
    max_tokens: 500
    timeout_seconds: 30
    retry_on_failure: 2
    fallback_model: gpt-4o-mini
  prompt:
    template: default
    custom_template: ''
    system_prompt: You are a disciplined trading analyst. Always respond with valid
      JSON.
    include_indicators: true
    include_news: true
    include_portfolio: true
    include_reasoning_chain: false
    max_news_items: 5
    indicator_set:
    - rsi
    - macd
    - ema_20
    - ema_50
    - bb
    timeframe_context:
    - 15m
    - 1h
    - 4h
  decision:
    action_types:
    - BUY
    - SELL
    - HOLD
    - CLOSE_ALL
    confidence_threshold: 65
    require_reasoning: true
    max_amount_pct: 15
  rules:
  - name: rsi_oversold
    condition: rsi < 30
    action: BUY
    amount_pct: 5
    confidence: 70
  - name: rsi_overbought
    condition: rsi > 70
    action: SELL
    amount_pct: 5
    confidence: 70
  partial_exit_levels:
  - pct_gain: 5.0
    exit_pct: 25
  - pct_gain: 10.0
    exit_pct: 25
  - pct_gain: 15.0
    exit_pct: 50
  rule_builder:
    rules:
    - signal: btc_rsi
      condition: rsi_below
      threshold: 30
      action: buy
      confidence_weight: 0.6
risk:
  profile: moderate
  position_sizing:
    method: fixed_pct
    max_pct: 8
    min_pct: 1
  stop_loss:
    method: atr
    atr_multiplier: 1.5
    fixed_pct: 2
    trailing_pct: 1.5
    trailing_activation_pct: 1
  take_profit:
    method: rr_ratio
    rr_ratio: 2
    fixed_pct: 4
    partial_exit_steps: []
  daily_limits:
    max_loss_pct: 5
    max_trades: 20
    max_open_positions: 5
    cooldown_minutes: 30
    max_consecutive_losses: 3
  portfolio:
    reserve_pct: 10
  trailing_stop:
    trail_percent: 2.0
    activation_threshold: 1.0
    description: Trailing stop-loss that moves up with price
  kelly:
    fraction: 0.5
    min_samples: 10
    default_win_rate: 0.55
    description: Fractional Kelly criterion for position sizing
trading:
  symbols:
  - symbol: BTCUSDT
    enabled: true
    timeframe: 15m
    strategy_override: ''
    risk_override: ''
  - symbol: ETHUSDT
    enabled: true
    timeframe: 15m
  - symbol: SOLUSDT
    enabled: false
    timeframe: 5m
  paper_mode: true
  fee_pct: 0.1
  slippage_pct: 0.05
sentiment:
  enabled: true
  feeds:
  - url: https://cryptoslate.com/feed/
    weight: 1.0
  - url: https://www.coindesk.com/arc/outboundfeeds/rss/
    weight: 1.0
  - url: https://cointelegraph.com/rss
    weight: 0.8
  max_items: 10
  cache_hours: 2
  symbol_filter: true
  sentiment_prompt: brief
  sentiment_model_override: ''
notifiers:
  telegram:
    bot_token: ${TG_BOT_TOKEN}
    chat_id: ${TG_CHAT_ID}
    alerts:
    - trade
    - stop_loss
    - daily_report
    - error
    - kill_switch
    commands: true
    daily_report_time: '21:00'
    daily_report_timezone: Asia/Jakarta
  discord:
    webhook_url: ${DISCORD_WEBHOOK}
    alerts:
    - trade
    - stop_loss
    - error
  webhook:
    url: https://your-server.com/api/trade-alert
    method: POST
    headers:
      Authorization: Bearer ${WEBHOOK_TOKEN}
    alerts:
    - trade
    - stop_loss
  console:
    alerts:
    - all
schedule:
  interval_minutes: 15
  backfill_on_start: true
  missed_ticks_grace: 5
backtest:
  start_date: '2025-01-01'
  end_date: '2025-06-01'
  initial_capital: 10000
  symbols:
  - BTCUSDT
  timeframe: 15m
  strategy: llm
  paper_mode: true
  output_format: json
  output_path: ~/.trade-agent/backtest-results/
storage:
  db_path: ~/.trade-agent/trade-agent.db
  backup_on_start: true
  backup_dir: ~/.trade-agent/backups/
  retention_days: 90
safety:
  paper_mode_required_first_run: true
  kill_switch_enabled: true
  auto_stop_on_error: true
  max_api_failures: 5
  notify_on_kill: true
exchange:
  bybit_futures:
    leverage: 10
    margin_mode: cross
    position_mode: one-way
    testnet: false
    description: Bybit USDT perpetual futures
dashboard:
  port: 8080
  theme: dark
